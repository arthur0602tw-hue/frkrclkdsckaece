        /* 搖晃動畫 */
        @keyframes gentle-shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
        .shake-hover:hover {
            animation: gentle-shake 0.5s ease-in-out infinite;
        }

        /* 頂級電影感超慢速漸變（2.5 秒，極具呼吸感與優雅感） */
        .cinematic-transition {
            transition: opacity 2.5s cubic-bezier(0.16, 1, 0.3, 1), transform 2.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 背景模糊與切換專用慢速轉場 */

            transition: opacity 1.5s ease-in-out, filter 2.5s cubic-bezier(0.16, 1, 0.3, 1);

    <script>
        // 立即定義全域圖片錯誤處理函數，避免 HTML 解析載入圖片失敗時發生 ReferenceError
        function handleBgError(img) {
            console.log("本地背景圖暫未載入。請下載 HTML 並與照片放在同一資料夾中執行。");
            img.style.opacity = '0';
        }
        function handleAvatarError(img) {
            console.log("本地頭像暫未載入。請下載 HTML 並與照片放在同一資料夾中執行。");
            img.style.display = 'none';
        }

        // 全域定義灑花彩帶效果，避免 ES Module 載入時序或作用域導致的 ReferenceError
        function finalConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            canvas.classList.remove('hidden');
            
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#f43f5e', '#38bdf8', '#fbbf24', '#34d399', '#a78bfa'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });

                particles = particles.filter(p => p.y < canvas.height);
                if (particles.length > 0) {
                    requestAnimationFrame(draw);
                } else {
                    canvas.classList.add('hidden');
                }
            }

            draw();
        }
    </script>

        async function initStorage() {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {

                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {

            const currentBg = stageData[currentStage].bg || "IMG_4245.jpg";
            
            if (state === 'cover') {

                    bgImg.classList.remove('opacity-100');
                    bgImg.classList.add('opacity-0');

                    bgOverlay.className = "absolute inset-0 bg-gradient-to-b from-sky-200/50 via-sky-300/60 to-sky-400/80 transition-all duration-[1500ms] ease-out";
                }
            } else if (state === 'clear') {
                if (bgImg) {
                    if (bgImg.getAttribute('src') !== currentBg) {
                        bgImg.setAttribute('src', currentBg);
                    }
                    bgImg.classList.remove('opacity-0');
                    bgImg.classList.add('opacity-100');
                    bgImg.style.filter = 'blur(0px) brightness(92%)';
                }
                if (bgOverlay) {
                    bgOverlay.className = "absolute inset-0 bg-black/5 transition-all duration-[1500ms] ease-out";

            } else if (state === 'blurry') {

                                <div id="reply-section" class="mt-6 pt-5 border-t border-slate-200 space-y-3">
                                    <p class="font-bold text-slate-800 text-sm md:text-base">寫下妳的回覆：</p>
                                    <textarea id="reply-textarea" rows="3" placeholder="在這裡寫下妳想說的話..." class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm md:text-base text-slate-800 focus:outline-none focus:border-sky-500 transition-all resize-none shadow-sm"></textarea>
                                    <div class="flex justify-between items-center pt-1">
                                        <span class="text-[11px] text-slate-400">留言將會安全且匿名地送達承志 ✉️</span>
                                        <button onclick="submitMessage()" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white text-xs md:text-sm font-black px-5 py-2.5 rounded-xl shadow-md transition transform active:scale-95 flex items-center space-x-1.5">
                                            <span>送出留言</span>
                                            <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="reply-sent-status" class="hidden mt-6 pt-5 border-t border-slate-200 text-center space-y-3">
                                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 text-emerald-500 border border-emerald-100 text-2xl animate-pulse">✨</div>
                                    <p class="font-black text-emerald-600 text-sm md:text-base">留言已成功送達</p>
                                    <p class="text-xs text-slate-500 leading-relaxed max-w-xs mx-auto">謝謝妳。願我們的記憶停留在最美好的瞬間，也祝我們未來的日子裡一切都好。</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="w-full flex flex-col items-center justify-center text-center space-y-8 py-4">
                            <p class="text-lg md:text-xl text-slate-700 leading-relaxed font-bold tracking-wide text-center">${data.text}</p>
                            <div class="flex justify-center space-x-6 py-2">
                                ${data.icons.map((icon, idx) => `
                                    <button onclick="clickStoryIcon(this, ${idx}, '${data.effectType}')" class="w-16 h-16 rounded-full bg-sky-50 hover:bg-sky-100 border border-sky-200 shadow-md flex items-center justify-center text-3xl transition duration-300 transform hover:scale-110 active:scale-90 select-none">
                                        ${icon}
                                    </button>
                                `).join('')}
                            </div>
                            <p class="text-sm md:text-base text-sky-500 font-extrabold animate-pulse tracking-wide">${data.hint}</p>
                        </div>
                    `;
                }

                card.classList.remove('opacity-0', 'translate-y-8');
                topHeader.classList.remove('opacity-0');
                bottomFooter.classList.remove('opacity-0');
                lucide.createIcons();
            }, entranceDelay);
        }

        // --- 點擊 Icon 互動 ---
        function clickStoryIcon(element, index, effectType) {
            if (stageProgress[index]) return;
            stageProgress[index] = true;
            
            if (effectType === 'squish') {
                element.innerHTML = "🎄";
                element.className = "w-16 h-16 rounded-full bg-emerald-50 border border-emerald-200 shadow-inner flex items-center justify-center text-3xl transition duration-300 transform scale-100 rotate-12 opacity-95 select-none pointer-events-none animate-pulse";
            } else if (effectType === 'snowball') {
                element.innerHTML = "💨";
                element.className = "w-16 h-16 rounded-full bg-sky-50/50 border border-sky-100 shadow-inner flex items-center justify-center text-3xl transition duration-300 transform scale-125 opacity-0 select-none pointer-events-none";
            } else if (effectType === 'pop') {
                element.innerHTML = "💥";
                element.className = "w-16 h-16 rounded-full bg-rose-50 border border-rose-200 shadow-inner flex items-center justify-center text-3xl transition duration-300 transform scale-50 opacity-0 select-none pointer-events-none";
            } else if (effectType === 'openEnvelope') {
                element.innerHTML = "✉️";
                element.className = "w-16 h-16 rounded-full bg-sky-50 border border-sky-100 shadow-inner flex items-center justify-center text-3xl transition duration-300 transform scale-100 opacity-90 select-none pointer-events-none";
            }

            if (stageProgress.every(status => status === true)) {
                if (currentStage === stageData.length - 1) {
                    setTimeout(() => {
                        const iconGroup = document.getElementById('icon-group');
                        if (iconGroup) iconGroup.classList.add('hidden');
                        
                        const iconHint = document.getElementById('icon-hint');
                        if (iconHint) iconHint.classList.add('hidden');
                        
                        const letter = document.getElementById('letter-content');
                        if (letter) {
                            letter.classList.remove('hidden');
                            setTimeout(() => {
                                letter.classList.remove('translate-y-4', 'opacity-0');
                                letter.classList.add('translate-y-0', 'opacity-100');
                            }, 50);
                        }
                    }, 800);
                } else {
                    setTimeout(() => {
                        nextStep();
                    }, 1200);
                }
            }
        }

        // --- 點擊送出留言功能 ---
        async function submitMessage() {
            const replyTextarea = document.getElementById('reply-textarea');
            const text = replyTextarea.value.trim();
            
            if (!text) {
                showToast("請輸入一些字再送出唷 ❄️");
                return;
            }

            const timestamp = new Date().toISOString();

            try {
                if (useFirebase && db) {
                    // 寫入 Firebase (遵循 Rule 1 的指定嚴格路徑規範)
                    const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                    await addDoc(collectionRef, {
                        text: text,
                        timestamp: timestamp
                    });
                } else {
                    // 本地 localStorage 離線快取備份
                    const localMsgs = JSON.parse(localStorage.getItem('farewell_msgs') || '[]');
                    localMsgs.push({ text: text, timestamp: timestamp, id: 'local_' + Date.now() });
                    localStorage.setItem('farewell_msgs', JSON.stringify(localMsgs));
                }

                // 隱藏輸入區，優雅地顯現成功提示
                document.getElementById('reply-section').classList.add('hidden');
                document.getElementById('reply-sent-status').classList.remove('hidden');

                // 送出後撒滿天亮彩碎紙，浪漫道別
                finalConfetti();
                showToast("留言成功送達承志的手中囉 ✉️");
            } catch (err) {
                console.error("Message submission failed:", err);
                showToast("發送失敗，請再試一次！");
            }
        }

        // --- 點擊署名 5 次開啟密碼驗證 (Easter Egg) ---
        let sigClicks = 0;
        function handleSignatureClick() {
            sigClicks++;
            if (sigClicks >= 5) {
                sigClicks = 0;
                openPasswordModal();
            }
        }

        function openPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('admin-password-input').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('admin-password-input').value = '';
        }

        function verifyAdminPassword() {
            const val = document.getElementById('admin-password-input').value;
            if (val === '0949') { // 取自 DSC09949 的時空密碼
                closePasswordModal();
                openAdminModal();
                showToast("解鎖成功，進入接收後台 🔓");
            } else {
                showToast("密碼錯誤，請再試一次 🔒");
                document.getElementById('admin-password-input').value = '';
            }
        }

        // --- 後台管理員彈跳視窗 (Rule 2 規範：全本機端進行排序/篩選) ---
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            loadAndRenderMessages();
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        // 載入與排序留言
        async function loadAndRenderMessages() {
            const container = document.getElementById('messages-list-container');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 font-medium">讀取留言中...</div>`;

            let messages = [];

            try {
                if (useFirebase && db) {
                    // Rule 2: 絕不進行複雜的 orderBy, 獲取所有資料並在記憶體內排序
                    const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                    const snapshot = await getDocs(collectionRef);
                    snapshot.forEach(docSnap => {
                        messages.push({ id: docSnap.id, ...docSnap.data() });
                    });
                } else {
                    messages = JSON.parse(localStorage.getItem('farewell_msgs') || '[]');
                }

                // 記憶體端依時間排序 (新留言在最上層) (Rule 2 實踐)
                messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderMessagesList(messages);
            } catch (err) {
                console.error("Fetch failed:", err);
                container.innerHTML = `<div class="text-center py-8 text-rose-500 font-bold">載入失敗，請確認網路！</div>`;
            }
        }

        // 即時監聽雲端更新 (若為雲端模式)
        function listenToMessages() {
            if (!useFirebase || !db) return;
            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            onSnapshot(collectionRef, (snapshot) => {
                const messages = [];
                snapshot.forEach(docSnap => {
                    messages.push({ id: docSnap.id, ...docSnap.data() });
                });
                // 記憶體排序
                messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (!document.getElementById('admin-modal').classList.contains('hidden')) {
                    renderMessagesList(messages);
                }
            }, (error) => {
                console.error("Listening failed:", error);
            });
        }

        function renderLocalMessages() {
            const messages = JSON.parse(localStorage.getItem('farewell_msgs') || '[]');
            messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderMessagesList(messages);
        }

        function renderMessagesList(messages) {
            const container = document.getElementById('messages-list-container');
            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold text-sm">目前還沒有收到 Priya 的任何留言唷... ✉️</div>`;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const dateStr = new Date(msg.timestamp).toLocaleString('zh-TW', { hour12: false });
                return `
                    <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl relative group transition hover:shadow-sm">
                        <div class="text-xs text-sky-500 font-black mb-1.5">${dateStr}</div>
                        <p class="text-sm text-slate-700 leading-relaxed font-bold break-words whitespace-pre-wrap pr-10">${escapeHtml(msg.text)}</p>
                        <!-- 刪除按鈕 -->
                        <button onclick="deleteMessage('${msg.id}')" class="absolute top-4 right-4 text-slate-300 hover:text-rose-500 transition-colors" title="刪除這條留言">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // 刪除留言功能
        async function deleteMessage(id) {
            if (!confirm("確定要徹底刪除這條留言嗎？")) return;

            try {
                if (useFirebase && db && !id.startsWith('local_')) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', id);
                    await deleteDoc(docRef);
                } else {
                    let localMsgs = JSON.parse(localStorage.getItem('farewell_msgs') || '[]');
                    localMsgs = localMsgs.filter(m => m.id !== id);
                    localStorage.setItem('farewell_msgs', JSON.stringify(localMsgs));
                    renderLocalMessages();
                }
                showToast("留言已成功刪除 🗑️");
                if (useFirebase) {
                    loadAndRenderMessages();
                }
            } catch (err) {
                console.error("Delete failed:", err);
                showToast("刪除失敗，請重新再試！");
            }
        }

        // HTML 安全過濾
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }

        // 自定義 Toast
        function showToast(text) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        // --- 切頁控制 (Expose to global scope for module standard compatibility) ---
        function triggerPlane() {
            const btn = document.getElementById('plane-btn');
            btn.classList.add('scale-95', 'rotate-6', 'opacity-90');
            
            const card = document.getElementById('game-card');
            card.classList.add('opacity-0', 'translate-y-8');
            
            setTimeout(() => {
                nextStepDirect(); 
            }, 1000);
        }

        function nextStep() {
            if (currentStage < stageData.length - 1) {
                const card = document.getElementById('game-card');
                const topHeader = document.getElementById('top-header');
                const bottomFooter = document.getElementById('bottom-footer');
                
                card.classList.add('opacity-0', 'translate-y-8');
                topHeader.classList.add('opacity-0');
                bottomFooter.classList.add('opacity-0');
                
                setTimeout(() => {
                    currentStage++;
                    renderStage();
                }, 1200);
            }
        }

        function nextStepDirect() {
            currentStage++;
            renderStage();
        }

        function prevStep() {
            if (currentStage > 0) {
                const card = document.getElementById('game-card');
                const topHeader = document.getElementById('top-header');
                const bottomFooter = document.getElementById('bottom-footer');
                
                card.classList.add('opacity-0', 'translate-y-8');
                topHeader.classList.add('opacity-0');
                bottomFooter.classList.add('opacity-0');
                
                setTimeout(() => {
                    currentStage--;
                    renderStage();
                }, 1200);
            }
        }

        // 將所有可能在 HTML 事件監聽器中被調用的函數暴露至全域 scope (ESM 規範)
        window.triggerPlane = triggerPlane;
        window.prevStep = prevStep;
        window.clickStoryIcon = clickStoryIcon;
        window.submitMessage = submitMessage;
        window.toggleMute = toggleMute;
        window.handleSignatureClick = handleSignatureClick;
        window.closePasswordModal = closePasswordModal;
        window.verifyAdminPassword = verifyAdminPassword;
        window.closeAdminModal = closeAdminModal;
        window.deleteMessage = deleteMessage;

        // --- 視窗載入與初始化 ---
        window.onload = function() {
            lucide.createIcons();
            initStorage(); // 初始化雲端儲存
            renderStage();
        };
    </script>
</body>
</html>
